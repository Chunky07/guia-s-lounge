<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cellphone &middot; Isang Aklat</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --ink:#2b1d12; --parch-a:#f7f0dd; --parch-b:#e9dcbe; --parch-back:#ded0b0;
    --gold:#d4af37; --cover:#4a1d2f; --turndur:1.05s;
  }
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 38%,#261142 0%,#130a24 52%,#07040e 100%);
    color:#e8dcc0;font-family:"Bookman Old Style",Georgia,"Times New Roman",serif;
    overflow:hidden;display:flex;flex-direction:column;
  }
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
      filter:blur(24px) brightness(.32) saturate(.6);transform:scale(1.14);z-index:0}
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;
        background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 22%,rgba(4,2,10,.86) 100%)}
  #candle{position:fixed;left:50%;top:52%;width:120vmax;height:120vmax;transform:translate(-50%,-50%);
      z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.5;
      background:radial-gradient(circle,rgba(255,196,110,.16) 0%,rgba(255,170,80,.06) 34%,transparent 62%);
      animation:flicker 5.5s ease-in-out infinite}
  @keyframes flicker{
    0%,100%{opacity:.46;transform:translate(-50%,-50%) scale(1)}
    28%{opacity:.58;transform:translate(-50.4%,-49.6%) scale(1.035)}
    46%{opacity:.42;transform:translate(-49.6%,-50.3%) scale(.982)}
    71%{opacity:.54;transform:translate(-50.2%,-50.6%) scale(1.022)}}
  #dust{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .mote{position:absolute;border-radius:50%;background:rgba(255,226,150,.5);
        box-shadow:0 0 7px rgba(255,210,120,.65);animation:drift linear infinite}
  @keyframes drift{
    0%{transform:translate3d(0,14vh,0) scale(.55);opacity:0}
    14%{opacity:.8}84%{opacity:.45}
    100%{transform:translate3d(24px,-104vh,0) scale(1.15);opacity:0}}
  header{position:relative;z-index:6;text-align:center;padding:16px 16px 2px}
  h1{font-size:clamp(19px,3.2vw,31px);letter-spacing:.17em;font-weight:400;color:var(--gold);
     text-shadow:0 0 24px rgba(212,175,55,.45)}
  header p{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#8d7f9e;margin-top:5px}
  #stage{position:relative;z-index:6;flex:1;display:flex;align-items:center;
         justify-content:center;padding:6px 16px 0;min-height:0}
  #book{position:relative;width:min(900px,94vw);aspect-ratio:16/10;max-height:66vh;
        perspective:3000px;perspective-origin:50% 50%}
  .stage{position:absolute;inset:0;transform-style:preserve-3d}
  .under{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;
         background:linear-gradient(160deg,var(--parch-a),var(--parch-b) 85%);
         box-shadow:0 18px 40px rgba(0,0,0,.55)}
  #uL{left:0;border-radius:6px 0 0 6px}
  #uR{right:0;border-radius:0 6px 6px 0;
      background:linear-gradient(200deg,var(--parch-a),var(--parch-b) 85%);
      box-shadow:inset 16px 0 30px -16px rgba(84,56,28,.5),0 18px 40px rgba(0,0,0,.55)}
  #turn{position:absolute;top:0;bottom:0;left:50%;width:50%;
        transform-origin:left center;transform-style:preserve-3d;
        transition:transform var(--turndur) cubic-bezier(.52,.06,.6,.18)}
  #turn.nomo{transition:none}
  #turn.turning{transform:rotateY(-180deg) rotateZ(.35deg)}
  .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;
        background:linear-gradient(160deg,var(--parch-a),var(--parch-b) 85%)}
  .face.back{transform:rotateY(180deg);
        background:repeating-linear-gradient(92deg,rgba(140,110,60,.045) 0 2px,transparent 2px 5px),
                   linear-gradient(200deg,var(--parch-back),#d6c7a6)}
  #curl{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
        background:linear-gradient(90deg,rgba(46,28,10,.26) 0%,rgba(255,252,238,.34) 38%,
                   rgba(255,250,230,.12) 58%,rgba(46,28,10,.22) 100%);
        transition:opacity .35s ease}
  #turn.turning #curl{opacity:1;animation:sweep var(--turndur) linear}
  @keyframes sweep{0%{background-position:120% 0}100%{background-position:-60% 0}}
  #cast{position:absolute;top:0;bottom:0;left:50%;width:50%;pointer-events:none;z-index:4;
        opacity:0;transition:opacity .45s ease;
        background:linear-gradient(90deg,rgba(38,22,8,.62),rgba(38,22,8,.18) 46%,transparent 82%)}
  #cast.lit{opacity:.9}
  .gutter{position:absolute;top:-2px;bottom:-2px;left:50%;width:46px;transform:translateX(-50%);
        pointer-events:none;z-index:5;opacity:.72;transition:opacity .4s ease;
        background:linear-gradient(90deg,transparent,rgba(62,38,16,.16) 42%,rgba(62,38,16,.26) 52%,transparent)}
  #turn.turning ~ .gutter{opacity:1}
  .cover{position:absolute;top:-12px;bottom:-12px;width:50%;z-index:7;
         transform-style:preserve-3d;backface-visibility:hidden;
         transition:transform 1.5s cubic-bezier(.3,1.12,.35,1)}
  #covR{right:-8px;transform-origin:left center;transform:rotateY(0deg);
        background:linear-gradient(140deg,#5d2740,#33121f 62%,#240c16);
        box-shadow:inset 0 0 0 2px rgba(212,175,55,.4),inset 0 0 30px rgba(0,0,0,.75)}
  #covL{left:-8px;transform-origin:right center;transform:rotateY(0deg);
        background:linear-gradient(220deg,#5d2740,#33121f 62%,#240c16);
        box-shadow:inset 0 0 0 2px rgba(212,175,55,.4),inset 0 0 30px rgba(0,0,0,.75)}
  #covR::after,#covL::after{content:"";position:absolute;left:50%;top:50%;
        width:74px;height:74px;margin:-37px 0 0 -37px;opacity:.5;
        border:1px solid rgba(212,175,55,.55);transform:rotate(45deg);
        box-shadow:inset 0 0 22px rgba(212,175,55,.22)}
  #book.open #covR{transform:rotateY(-166deg)}
  #book.open #covL{transform:rotateY(166deg)}
  .under,.face{padding:clamp(14px,2.8vw,32px);display:flex;
         flex-direction:column;justify-content:center;overflow:hidden;
         color:var(--ink);font-size:clamp(12px,1.5vw,19px);line-height:1.68;
         text-align:left;overflow-wrap:break-word}
  .under p,.face p{margin:0 0 .5em;text-indent:1.1em;animation:ink .45s ease}
  @keyframes ink{from{transform:translateY(7px)}to{transform:none}}
  .under p:first-child,.face p:first-child{text-indent:0}
  .under p:first-child::first-letter,.face p:first-child::first-letter{font-size:2.3em;
     float:left;line-height:.86;padding:.05em .1em 0 0;
     color:var(--cover);text-shadow:1px 1px 0 rgba(212,175,55,.5)}
  .under p.blank,.face p.blank{opacity:.3;text-align:center;text-indent:0}
  .folio{position:absolute;bottom:2px;font-size:11px;letter-spacing:.2em;color:#9b8763}
  /* ---------- navigation ---------- */
  /* ---------- tools ---------- */
  #tools{position:relative;z-index:8;display:flex;gap:7px;align-items:center;
         justify-content:center;flex-wrap:wrap;padding:6px 16px 2px;max-width:900px;
         width:100%;margin:0 auto}
  .tb{padding:7px 13px;border-radius:99px;cursor:pointer;font-family:inherit;
      font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#c6b49b;
      background:rgba(255,255,255,.045);border:1px solid rgba(212,175,55,.26);
      transition:color .16s,border-color .16s,background .16s}
  .tb:hover{color:var(--gold);border-color:rgba(212,175,55,.6);background:rgba(212,175,55,.09)}
  .tb.nav{padding:9px 20px;font-size:11.5px}
  .tb:disabled{opacity:.28;cursor:default;color:#7d6f8d}
  .tb:disabled:hover{color:#7d6f8d;border-color:rgba(212,175,55,.26);background:rgba(255,255,255,.045)}
  /* ---------- playback ---------- */
  #bar{position:relative;z-index:8;padding:8px 18px 14px;display:flex;align-items:center;
       gap:13px;max-width:900px;width:100%;margin:0 auto}
  .btn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;cursor:pointer;
       border:1px solid rgba(212,175,55,.5);
       background:radial-gradient(circle at 35% 30%,#5d2740,#2b1020);
       color:var(--gold);font-size:17px;display:grid;place-items:center;
       box-shadow:0 0 18px rgba(212,175,55,.22);transition:transform .16s,box-shadow .16s,opacity .16s}
  .btn:hover{transform:scale(1.07);box-shadow:0 0 28px rgba(212,175,55,.42)}
  .btn.off{opacity:.45}
  .track{flex:1;position:relative;display:flex;align-items:center;height:26px}
  #seek{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
        background:linear-gradient(90deg,var(--gold) var(--p,0%),rgba(255,255,255,.12) var(--p,0%));
        outline:none;cursor:pointer}
  #seek::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
        background:radial-gradient(circle at 35% 30%,#fff2c4,var(--gold));
        box-shadow:0 0 12px rgba(212,175,55,.8);cursor:grab}
  #seek::-moz-range-thumb{width:17px;height:17px;border:0;border-radius:50%;
        background:radial-gradient(circle at 35% 30%,#fff2c4,var(--gold));
        box-shadow:0 0 12px rgba(212,175,55,.8)}
  #marks{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);pointer-events:none}
  .mk{position:absolute;top:50%;width:2px;height:10px;transform:translate(-50%,-50%);
      background:rgba(255,236,170,.4);border-radius:2px}
  #time{flex:0 0 auto;font-size:12px;letter-spacing:.08em;color:#b9a8c9;
        font-variant-numeric:tabular-nums;min-width:104px;text-align:right}
  #pg{color:var(--gold)}
  #intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
         background:radial-gradient(ellipse at 50% 45%,rgba(30,14,58,.9),rgba(4,2,10,.97))}
  #intro.hide{display:none}
  #intro h2{font-size:clamp(22px,4vw,40px);color:var(--gold);letter-spacing:.14em;font-weight:400;
     text-shadow:0 0 30px rgba(212,175,55,.5);text-align:center}
  #intro p{color:#9d8fb0;font-size:12px;letter-spacing:.26em;text-transform:uppercase;
     margin-top:12px;text-align:center;padding:0 18px}
  #go{margin-top:28px;padding:14px 40px;border-radius:99px;cursor:pointer;font-family:inherit;
      font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#1c0d06;
      background:linear-gradient(180deg,#f0d585,var(--gold));border:none;
      box-shadow:0 0 34px rgba(212,175,55,.5);transition:transform .16s}
  #go:hover{transform:scale(1.05)}
  @media(max-width:680px){#book{aspect-ratio:3/4}#time{min-width:86px;font-size:11px}}
  @media(prefers-reduced-motion:reduce){
    #candle,.mote,.under p,.face p{animation:none!important}
    #turn{transition-duration:.01ms!important}
    .cover{transition-duration:.3s!important}}
</style>
</head>

\n21\n00:01:46,420 --> 00:01:54,280\nThe only phone you'll ever need. Pumikit si J at kinapa ang power on na button sa\n\n22\n00:01:54,280 --> 00:02:01,000\nkanyang noo. Inisip niya ang muka ng kanyang anak na halos mapasigaw siya sa\n\n23\n00:02:01,000 --> 00:02:07,560\nmabilis na paglilipat-lipat ng mga imahen na muka sa kanyang utak na kung\n\n24\n00:02:07,560 --> 00:02:11,680\ntutuosin ay hindi naman talaga sa utak na ilumilitaw ang mga imahen kundi sa\n\n25\n00:02:11,680 --> 00:02:18,320\ntransmitter/receiver ng cell. Pilit niyang hinahanap ang mukha ng kanyang anak.\n\n26\n00:02:18,320 --> 00:02:23,160\nBigla sa gitna ng mga muka'y, tumalon lumitaw si J Jr.\n\n27\n00:02:23,160 --> 00:02:31,480\n\"Hi dad!\" Sigaw nito. Nagulat si J. Nagdilim ang lahat para sa kanya.\n\n28\n00:02:31,480 --> 00:02:35,360\nSa dilim ay narinig niya ang tinig ng kanyang anak.\n\n29\n00:02:35,360 --> 00:02:40,560\n\"Dad! Dad, are you okay?\" Tanong ni J Jr.\n\n30\n00:02:40,560 --> 00:02:46,080\nDumilat si J. Nakakonekta pa rin ang cell niya.\n\n31\n00:02:46,080 --> 00:02:50,440\nNaramdaman niya sa kanyang noo ang mahinang ugong nito.\n\n32\n00:02:50,440 --> 00:02:57,540\nSinubukan niyang ipokus ang tingin sa nagsasalitang anak na nadiskonek for a while.\n\n33\n00:02:57,540 --> 00:02:59,240\n\"Kaka-musta?\"\n\n34\n00:02:59,240 --> 00:03:02,140\n\"Ayos lang\", tugon ng kanyang anak.\n\n35\n00:03:02,140 --> 00:03:05,060\n\"Glad, you are using cell.\"\n\n36\n00:03:05,060 --> 00:03:06,740\nTumango na si J.\n\n37\n00:03:06,740 --> 00:03:09,140\nSa isip ni J ay kumakaway siya.\n\n38\n00:03:09,140 --> 00:03:11,140\nKumaway rin ang anak niya.\n\n39\n00:03:11,140 --> 00:03:15,940\nNawala si J Jr., tapos na ang kanilang komunikasyon.\n\n40\n00:03:16,940 --> 00:03:20,540\nPinindot ni J ang kanyang noo, nawala ang ugong.\n\n41\n00:03:21,340 --> 00:03:22,940\nHindi na siya connected.\n\n42\n00:03:23,740 --> 00:03:29,940\nSaka lang niya naalala, na hindi niya nasabi sa kanyang anak ang kanyang pakay.\n\n43\n00:03:30,940 --> 00:03:34,540\nMagugutom na siya, kailangan niya ng food chips.\n\n44\n00:03:35,140 --> 00:03:36,940\nLalo lang nalungkot si J.\n\n45\n00:03:36,940 --> 00:03:40,280\nPinagmasdan niya ang kanyang kwarto.\n\n46\n00:03:40,280 --> 00:03:43,160\nKumpleto ito sa makabagong gamit.\n\n47\n00:03:43,160 --> 00:03:48,600\nLahat ng kailangan niya ay kailangan lang niyang sabihin at bigkasin\n\n48\n00:03:48,600 --> 00:03:52,520\ndahil sa voice controlled ang lahat ng gamit.\n\n49\n00:03:52,520 --> 00:03:54,280\nMula kama.\n\n50\n00:03:54,280 --> 00:03:58,960\nKung gusto niyang lumambot, tumigas, dumulas, sabihin lang niya.\n\n51\n00:03:58,960 --> 00:04:00,520\nHanggang inidoro.\n\n52\n00:04:00,520 --> 00:04:04,520\nKung gusto niyang hugasan siya, punasan siya o i-disintegrate.\n\n53\n00:04:04,520 --> 00:04:07,860\nang kanyang dumi, bago paman lumubas.\n\n54\n00:04:09,120 --> 00:04:12,460\nGinusto rin naman niya ang lahat ng iyon noon.\n\n55\n00:04:12,960 --> 00:04:19,940\nHinawakan niya muli ang 8810 at naramdaman niya ang lungkot na hindi mo tanggal-tanggal.\n\n56\n00:04:19,940 --> 00:04:23,540\nYung lungkot dahil sa lumipas na panahon.\n\n57\n00:04:24,040 --> 00:04:28,480\nDrawer, sabi ni J at bumukas ang kanyang drawer.\n\n58\n00:04:29,220 --> 00:04:33,120\nPapel, sabi ni J at walang nangyari.\n\n59\n00:04:33,120 --> 00:04:47,120\nSa kalang niyan naalala, wala na nga pa lang papel. Wala na rin panulat. Bakit nga naman magsusulat kung pwede mong kausapin ang gusto mong sulatan face-to-face, in real life images?\n\n60\n00:04:47,120 --> 00:04:51,910\nTotoong-too ang mga itsura pero imahen pa rin.\n\n61\n00:04:52,910 --> 00:04:58,910\nTumayo si J at napansin niyang wala na ring bintana ang kanyang kwarto.\n\n62\n00:04:58,910 --> 00:05:03,310\nKailan nga ba na uso ang bintana? Bakit nga ba may bintana?\n\n63\n00:05:04,190 --> 00:05:08,030\nAng mayroon sa kwarto niya ay isang image provider.\n\n64\n00:05:08,830 --> 00:05:15,150\nSabihin lang niya kung ano ang gusto niyang makita at makita niya mula sa mga tanawin,\n\n65\n00:05:15,510 --> 00:05:18,070\ndagat hanggang sa mga tanawing bundok.\n\n66\n00:05:18,830 --> 00:05:20,590\nBakit kailangan ng bintana?\n\n67\n00:05:20,990 --> 00:05:26,190\nAng image provider din ang nagsisilbing monitor ng kanyang computer.\n\n68\n00:05:26,190 --> 00:05:31,610\nNaisip niya na padalhan na lang niya si J Jr ng cell mail.\n\n69\n00:05:31,610 --> 00:05:35,290\nKaya nga lang, kailangan na nakakonekta siya.\n\n70\n00:05:35,290 --> 00:05:37,690\nAyaw niyang kumonekta.\n\n71\n00:05:37,690 --> 00:05:41,770\nAyaw niyang makita ang mabilis at papalit-palit ng mga muka.\n\n72\n00:05:41,770 --> 00:05:44,250\nTuwing kailangan niyang kumonekta.\n\n73\n00:05:44,250 --> 00:05:50,130\nAng pakaramdam niya ay nakikita rin siya ng milyong-milyong muka na iyon.\n\n74\n00:05:50,130 --> 00:05:55,090\nPakiramdam niya ay pinapanood siya pero hindi siya nakikita.\n\n75\n00:05:55,090 --> 00:06:03,340\nPumunta si J sa kabinet niya ng mga antique para isauli ang kanyang 8810.\n\n76\n00:06:03,340 --> 00:06:06,840\nIpinatong niya ito sa gitnang patungan.\n\n77\n00:06:06,840 --> 00:06:09,340\nNapansin niya isang kwadradong bagay.\n\n78\n00:06:09,340 --> 00:06:12,340\nInabot niya iyon at binuksan.\n\n79\n00:06:12,340 --> 00:06:16,340\nWala siyang maintindihan sa mga nakaguhit doon.\n\n80\n00:06:16,340 --> 00:06:18,340\nMay bigla siyang naalala.\n\n81\n00:06:18,340 --> 00:06:23,840\nPero hindi niya mailagay sa lugar kung tungkol saan ang bagay na hawak niya.\n\n82\n00:06:23,840 --> 00:06:26,480\nWalang kahit anong pindutan ng bagay\n\n83\n00:06:26,480 --> 00:06:30,240\nkapag binuksan ay mga pirasong papel\n\n84\n00:06:30,240 --> 00:06:31,800\nnatigilan siya.\n\n85\n00:06:31,800 --> 00:06:32,880\nPapel.\n\n86\n00:06:32,880 --> 00:06:35,880\nGanon nga ang itsura at pakiramdam ng papel.\n\n87\n00:06:35,880 --> 00:06:38,440\nPuno iyong bagay na iyon ng papel.\n\n88\n00:06:38,440 --> 00:06:42,640\nPantay-pantay at nakadi /*CORE-START*/
function createBook(deps){
  const {uL,uR,turn,turnF,turnB,cast,onFlip,dur,render} = deps;
  /* pages are read through deps every time, so the caller can repack them
     (after an upload or a save) without rebuilding the turn logic */
  const pair = k => { const P = deps.pages; return [P[2*k] || null, P[2*k+1] || null]; };
  const nSpreads = () => Math.ceil(deps.pages.length / 2);
  const html = render || (p => p
    ? p.l.map(c => '<p>' + (c && c.x !== undefined ? c.x : c) + '</p>').join('')
    : '<p class="blank">&mdash;</p>');

  let shown = 0, turning = false, tok = 0, pending = -1;

  function prepare(k){
    const L = pair(k), N = pair(k + 1);
    uL.innerHTML    = html(L[0]);
    uR.innerHTML    = html(N[1]);
    turnF.innerHTML = html(L[1]);
    turnB.innerHTML = html(N[0]);
    /* snap home without animating. Never set an inline transform here: it would
       outrank the .turning class and the leaf would silently stop turning. */
    turn.classList.add('nomo');
    turn.classList.remove('turning');
    void turn.offsetWidth;
    turn.classList.remove('nomo');
    if (cast) cast.classList.remove('lit');
    shown = k;
    return k;
  }

  function turnOnce(){
    if (turning) return shown;
    turning = true;
    pending = shown + 1;
    const my = ++tok;
    const right = deps.pages[2 * shown + 1];
    const span = Math.max(0.7, Math.min((dur ? dur(right) : 9) * 0.85, 2.2));
    turn.style.setProperty('--turndur', span.toFixed(2) + 's');
    turn.classList.add('turning');
    if (cast) cast.classList.add('lit');
    if (onFlip) onFlip();

    let finished = false;
    const finish = () => {
      if (finished || my !== tok) return;
      finished = true;
      turn.removeEventListener('transitionend', onEnd);
      prepare(shown + 1);
      turning = false;
      pending = -1;
    };
    const onEnd = e => {
      /* transitionend bubbles: #curl fades opacity over .35s and that used to
         complete the flip early. Only our own transform counts, and the listener
         must survive those, hence no {once:true}. */
      if (e && e.target && e.target !== turn) return;
      if (e && e.propertyName && e.propertyName !== 'transform') return;
      finish();
    };
    turn.addEventListener('transitionend', onEnd);
    setTimeout(() => { if (my === tok && turning) finish(); }, (span + 0.6) * 1000);
    return shown;
  }

  function go(i, animate){
    i = Math.max(0, Math.min(nSpreads() - 1, i));
    if (i === shown) return shown;
    if (turning){
      if (i === pending) return shown;      /* already flipping there */
      tok++; prepare(i); turning = false; pending = -1; return shown;
    }
    if (!animate || Math.abs(i - shown) > 1){ prepare(i); return shown; }
    turnOnce();
    return shown;
  }

  return {prepare, turnOnce, go, pair,
          get shown(){return shown;}, get turning(){return turning;}};
}
/*CORE-END*/

/* ---------------- SRT pipeline (mirror of clean_srt.py) ---------------- */
const esc  = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* keep milliseconds: splitting on '.' as well would silently drop them, which
   skews every cue duration and corrupts timings on export */
const tsec = t => { const p = String(t).split(/[:;,]/).map(Number);
                    return p[0]*3600 + p[1]*60 + p[2] + (p[3] || 0)/1000; };
const pad3 = s => String(s).slice(0,3).padEnd(3,'0');

function parseSrt(text){
  const cues = [];
  const blocks = String(text).replace(/^\uFEFF/,'').trim().split(/\n\s*\n/);
  const TIM = /(\d{1,2}:\d{2}:\d{2})[,.](\d+)\s*-->\s*(\d{1,2}:\d{2}:\d{2})[,.](\d+)/;
  for(const b of blocks){
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    const ti = lines.findIndex(l => l.includes('-->'));
    if(ti < 0) continue;
    const m = TIM.exec(lines[ti]);
    if(!m) continue;
    cues.push({ s: tsec(m[1] + ',' + pad3(m[2])),
                e: tsec(m[3] + ',' + pad3(m[4])),
                x: lines.slice(ti + 1).join(' ').replace(/\s+/g,' ').trim() });
  }
  return cues.map((c,i) => ({ id:i, s:c.s, e:c.e, x:c.x }));
}

function collapsePartial(text){
  const keep = [];
  for(const w of text.split(/\s+/)){
    const k = w.replace(/[.,]+$/,'').toLowerCase();
    const p = keep.length ? keep[keep.length-1].replace(/[.,]+$/,'').toLowerCase() : '';
    if(p && k !== p && (k.endsWith(p) || p.endsWith(k)) &&
       Math.abs(k.length - p.length) <= 4 && Math.min(k.length, p.length) >= 5){
      if(w.length > keep[keep.length-1].length) keep[keep.length-1] = w;
      continue;
    }
    keep.push(w);
  }
  return keep.join(' ').replace(/\s+/g,' ').trim();
}

function cleanCues(cues){
  for(const c of cues){
    const toks = c.x.split(/\s+/).filter(Boolean).map(w => {
      const m = w.match(/^[.,?!:;"']*([^.,?!:;"']+)([.,?!:;"']*)$/);
      if(!m) return w;
      const core = m[1], trail = m[2], low = core.toLowerCase();
      if(REP.SIMPLE[low]){
        let r = REP.SIMPLE[low];
        if(/^[A-Z]/.test(core)) r = r[0].toUpperCase() + r.slice(1);
        return r + trail;
      }
      if(core.length >= 4 && REP.GLUED[low]) return REP.GLUED[low] + trail;
      return w;
    });
    let text = toks.join(' ');
    for(const a of Object.keys(REP.PHRASES)){
      const re = new RegExp('\\b' + a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b', 'g');
      text = text.replace(re, () => REP.PHRASES[a]);
    }
    text = text.split(/\s+/).map(w => {
      const k = w.replace(/[.,]+$/,'').toLowerCase();
      return REP.SIMPLE[k] || w;
    }).join(' ');
    let prev;
    do { prev = text; text = text.replace(/\b([A-Z][a-z]{2,})\s+\1\b/g,'$1'); } while(text !== prev);
    c.x = collapsePartial(text);
  }
  for(let i = 1; i < cues.length; i++)
    if(cues[i].s < cues[i-1].e) cues[i].s = cues[i-1].e;
  const out = [];
  for(const c of cues){
    const last = out[out.length-1];
    if(last && (c.e - c.s) < 0.7){
      last.e = c.e;
      last.x = (last.x.replace(/\s+$/,'') + ' ' + c.x).trim();
    } else out.push(Object.assign({}, c));
  }
  return out;
}

function packPages(cues){
  const pages = []; let cur = [], chars = 0;
  for(const c of cues){
    /* never break below two cues, or a single long opening line gets a page
       to itself and the spread looks empty */
    if(cur.length >= 2 && (chars + c.x.length > 440 || c.e - cur[0].s > 26)){
      pages.push({ s:cur[0].s, e:cur[cur.length-1].e, l:cur });
      cur = []; chars = 0;
    }
    cur.push(c); chars += c.x.length + 1;
  }
  if(cur.length) pages.push({ s:cur[0].s, e:cur[cur.length-1].e, l:cur });
  return pages;
}

const srtTime = s => {
  s = Math.max(0, s || 0);
  const ms = Math.round((s - Math.floor(s)) * 1000);
  const p = (n,w) => String(n).padStart(w,'0');
  return p(Math.floor(s/3600),2) + ':' + p(Math.floor(s%3600/60),2) + ':' +
         p(Math.floor(s%60),2) + ',' + p(ms,3);
};

const ts = s => { s = Math.max(0, s|0 || 0); const p=(n,w)=>String(n).padStart(w,'0');

function loadBaked(){
  const parsed = parseSrt(BAKED_SRT);
  if(!parsed.length) return;
  CUES = cleanCues(parsed);
  rebuild(0);
}

/* ---------------- playback ---------------- */
/* Lead time: show a spread this many seconds BEFORE its narration begins, so
   the words are already on screen when you reach them, and so the ~2.2s page
   turn always finishes before its text starts being spoken. Raise it if you
   want more read-ahead. */
const LEAD = 2.4;
window.__lead = LEAD;            /* exposed so the test can assert against it */

/* a spread is TWO PACKED PAGES, not two cues - pages hold a variable number of
   cues (budget-packed), so this must walk pages, not cues */
function spreadAt(t){
  const P = DEPS.pages;
  const cut = t + LEAD;
  let i = 0;
  for(let k = 0; k < P.length; k++){ if(P[k].s <= cut) i = Math.floor(k/2); else break; }
  return i;
}
/* Page nav moves the AUDIO, not just the picture: the clock drives the spread,
   so seeking only the page would be undone by the next tick. */
function pageStart(i){ const p = DEPS.pages[2*i]; return p ? p.s : 0; }
function stepPage(delta){
  const target = Math.max(0, Math.min(spans() - 1, B.shown + delta));
  if(target === B.shown) return;
  vid.currentTime = pageStart(target);
  B.go(target, !vid.paused);
  updateNav();
}
function updateNav(){
  prevBtn.disabled = B.shown <= 0;
  nextBtn.disabled = B.shown >= spans() - 1;
  pgEl.textContent = (B.shown + 1) + ' / ' + spans();
}
prevBtn.addEventListener('click', () => stepPage(-1));
nextBtn.addEventListener('click', () => stepPage(1));

function tick(){
  const t = vid.currentTime, d = vid.duration || 0;
  if(d) seek.max = d;
  if(!seek.matches(':active')){
    seek.value = t;
    seek.style.setProperty('--p', (d ? t/d*100 : 0) + '%');
  }
  tc.textContent = ts(t) + ' / ' + ts(d);
  /* while paused a seek should land instantly, not launch an animation that
     keeps turning with the audio stopped */
  B.go(spreadAt(t), !vid.paused);
  updateNav();
}
vid.addEventListener('timeupdate', tick);
vid.addEventListener('loadedmetadata', () => { tick(); buildMarks(); });
seek.addEventListener('input', () => { vid.currentTime = +seek.value; B.go(spreadAt(+seek.value), false); });

playBtn.addEventListener('click', () => vid.paused ? vid.play() : vid.pause());
vid.addEventListener('play',  () => playBtn.innerHTML = '&#10073;&#10073;');
vid.addEventListener('pause', () => playBtn.innerHTML = '&#9654;');

document.getElementById('go').addEventListener('click', () => {
  document.getElementById('intro').classList.add('hide');
  bookEl.classList.add('open');
  setTimeout(() => {
    document.getElementById('covR').style.display = 'none';
    document.getElementById('covL').style.display = 'none';
  }, 1650);
  vid.play().catch(() => {});
});
/* no global keydown handler: a document-level handler swallows Space, so typing
   a space inside an editable cue would toggle playback instead of inserting it.
   The buttons remain keyboard-operable through normal focus + activation. */

/* ---------------- misc ---------------- */
function buildMarks(){
  const d = vid.duration || 1;
  document.getElementById('marks').innerHTML =
    CUES.map(c => '<span class="mk" style="left:' + (c.s/d*100).toFixed(3) + '%"></span>').join('');
}
window.addEventListener('resize', buildMarks);

let ac = null, soundOn = true;
function rustle(){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const dur = .32, sr = ac.sampleRate;
    const buf = ac.createBuffer(1, Math.floor(sr*dur), sr), d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++){
      const t = i/d.length; d[i] = (Math.random()*2-1) * Math.pow(1-t, 2.4);
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=.6;
    const hp = ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1000;
    const g  = ac.createGain(); g.gain.value = .13;
    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ac.destination);
    src.start();
  }catch(e){}
}
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.classList.toggle('off', !soundOn);
});

const dust = document.getElementById('dust');
for(let i = 0; i < 34; i++){
  const m = document.createElement('div'); m.className = 'mote';
  const sz = 1.4 + Math.random()*3.6;
  m.style.cssText = 'width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;'+
    'filter:blur('+(Math.random()*1.4).toFixed(1)+'px);'+
    'animation-duration:'+(14+Math.random()*22)+'s;animation-delay:-'+(Math.random()*30)+'s;';
  dust.appendChild(m);
}

loadBaked();
tick();
</script>
